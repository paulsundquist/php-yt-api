<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links – Open Your YouTube Queue | MyTubie</title>
    <meta name="description" content="Jump straight to your YouTube Watch Later playlist in one tap.">
    <link rel="canonical" href="https://mytubie.com/links.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="MyTubie">
    <meta property="og:title" content="Links – Open Your YouTube Queue | MyTubie">
    <meta property="og:description" content="Jump straight to your YouTube Watch Later playlist in one tap.">
    <meta property="og:url" content="https://mytubie.com/links.html">
    <meta name="twitter:card" content="summary">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 480px;
            width: 100%;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .home-btn {
            display: inline-flex;
        }

        .home-btn img {
            display: block;
            width: 40px;
            height: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: white;
            font-size: 40px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 30px 25px;
            text-align: center;
        }

        .card p {
            color: #4b5563;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .quick-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .open-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: #ef4444;
            color: white;
            text-decoration: none;
            border: none;
            padding: 16px 28px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .open-btn:hover {
            background: #dc2626;
            transform: translateY(-2px);
        }

        .open-btn:active {
            transform: translateY(0);
        }

        .pill-link {
            display: inline-flex;
            align-items: center;
            background: #667eea;
            color: white;
            text-decoration: none;
            padding: 16px 22px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .pill-link:hover {
            background: #5a6fd6;
            transform: translateY(-2px);
        }

        .note {
            margin-top: 20px;
            color: #9ca3af;
            font-size: 13px;
            line-height: 1.5;
        }

        .card + .card {
            margin-top: 20px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 15px;
        }

        .add-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 15px;
        }

        .add-form input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }

        .add-form input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .add-form button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .add-form button:hover {
            background: #5a6fd6;
        }

        .playlist-list {
            list-style: none;
            text-align: left;
        }

        .playlist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #e5e7eb;
        }

        .playlist-item:last-child {
            border-bottom: none;
        }

        .playlist-item a {
            color: #1f2937;
            text-decoration: none;
            font-weight: 500;
            flex: 1;
            overflow-wrap: anywhere;
        }

        .playlist-item a:hover {
            color: #667eea;
            text-decoration: underline;
        }

        .remove-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 20px;
            line-height: 1;
            padding: 4px 6px;
            flex: none;
        }

        .remove-btn:hover {
            color: #ef4444;
        }

        .empty-note {
            color: #9ca3af;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="title-row">
                <a href="/" class="home-btn" title="Home" aria-label="Home"><img src="/favicon.svg" alt="MyTubie Home"></a>
                <h1>Links</h1>
            </div>

        </header>

        <div class="card">
            <div class="quick-links" id="quickLinks">
                <a class="open-btn" href="https://www.youtube.com/playlist?list=WL">
                    Watch Later
                </a>
            </div>
        </div>
        <div class="card">

            <p class="note">You'll need to be signed in to YouTube for Watch Later
            <br/>On a phone, if you make the playlist shareable it is easier to copy/paste the URL</p>
        </div>

        <div class="card">
            <h2 class="section-title">My Playlists</h2>
            <form id="addPlaylistForm" class="add-form">
                <input type="text" id="playlistInput" placeholder="YouTube playlist URL or ID" required>
                <input type="text" id="labelInput" placeholder="Label" required>
                <button type="submit">Add</button>
            </form>
            <p class="empty-note" id="emptyNote">No playlists added yet.</p>
            <ul class="playlist-list" id="playlistList"></ul>
        </div>
    </div>

    <script>
        const PLAYLISTS_KEY = 'links_playlists';
        const addForm = document.getElementById('addPlaylistForm');
        const playlistInput = document.getElementById('playlistInput');
        const labelInput = document.getElementById('labelInput');
        const playlistList = document.getElementById('playlistList');
        const emptyNote = document.getElementById('emptyNote');
        const quickLinks = document.getElementById('quickLinks');

        function extractPlaylistId(value) {
            value = value.trim();
            if (value.startsWith('PL') && !value.includes('/') && !value.includes('?')) {
                return value;
            }
            try {
                const url = new URL(value);
                const listParam = url.searchParams.get('list');
                if (listParam) return listParam;
            } catch (e) {
                const match = value.match(/(?:list=)?([A-Za-z0-9_-]{10,})/);
                if (match) return match[1];
            }
            return null;
        }

        function loadPlaylists() {
            try {
                return JSON.parse(localStorage.getItem(PLAYLISTS_KEY)) || [];
            } catch (e) {
                return [];
            }
        }

        function savePlaylists(playlists) {
            localStorage.setItem(PLAYLISTS_KEY, JSON.stringify(playlists));
        }

        function renderPlaylists() {
            const playlists = loadPlaylists();

            // Quick-access pill next to the Watch Later button
            quickLinks.querySelectorAll('.pill-link').forEach(el => el.remove());
            playlists.forEach(pl => {
                const pill = document.createElement('a');
                pill.className = 'pill-link';
                pill.href = `https://www.youtube.com/playlist?list=${encodeURIComponent(pl.id)}`;
                pill.target = '_blank';
                pill.rel = 'noopener';
                pill.textContent = pl.label || pl.id;
                quickLinks.appendChild(pill);
            });

            // Manageable list with remove buttons
            playlistList.innerHTML = '';
            emptyNote.style.display = playlists.length ? 'none' : 'block';

            playlists.forEach((pl, index) => {
                const li = document.createElement('li');
                li.className = 'playlist-item';

                const a = document.createElement('a');
                a.href = `https://www.youtube.com/playlist?list=${encodeURIComponent(pl.id)}`;
                a.target = '_blank';
                a.rel = 'noopener';
                a.textContent = pl.label || pl.id;

                const removeBtn = document.createElement('button');
                removeBtn.type = 'button';
                removeBtn.className = 'remove-btn';
                removeBtn.setAttribute('aria-label', 'Remove playlist');
                removeBtn.textContent = '×';
                removeBtn.addEventListener('click', () => {
                    const updated = loadPlaylists();
                    updated.splice(index, 1);
                    savePlaylists(updated);
                    renderPlaylists();
                });

                li.appendChild(a);
                li.appendChild(removeBtn);
                playlistList.appendChild(li);
            });
        }

        addForm.addEventListener('submit', function(e) {
            e.preventDefault();
            const id = extractPlaylistId(playlistInput.value);
            if (!id) {
                alert('Please enter a valid YouTube playlist URL or ID');
                return;
            }
            const label = labelInput.value.trim();
            if (!label) {
                alert('Please enter a label');
                return;
            }
            const playlists = loadPlaylists();
            playlists.push({ id, label });
            savePlaylists(playlists);
            playlistInput.value = '';
            labelInput.value = '';
            renderPlaylists();
        });

        renderPlaylists();
    </script>
</body>
</html>
