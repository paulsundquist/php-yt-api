<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FameFrame — Author</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 700px;
            width: 100%;
        }

        .home-btn { display: inline-block; margin-bottom: 15px; }
        .home-btn img { display: block; width: 40px; height: 40px; }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            color: white;
            font-size: 38px;
            margin-bottom: 8px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 16px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 25px;
            margin-bottom: 20px;
        }

        h2 { color: #1f2937; font-size: 20px; margin-bottom: 18px; }

        .form-group { margin-bottom: 16px; }

        .form-group label {
            display: block;
            color: #374151;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 11px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }
        .input-row input { flex: 1; min-width: 0; }
        .input-row select {
            padding: 0 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            flex-shrink: 0;
            background: white;
        }
        button.search {
            background: #6b7280;
            padding: 0 16px;
            flex-shrink: 0;
        }
        button.search:hover { background: #4b5563; }

        .preview {
            margin-top: 10px;
            height: 180px;
            background: #111827;
            border-radius: 8px;
            display: none;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview img { max-width: 100%; max-height: 100%; object-fit: contain; }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:hover { background: #1d4ed8; }
        button:disabled { background: #d1d5db; cursor: not-allowed; }

        .msg {
            margin-top: 12px;
            font-size: 14px;
            min-height: 18px;
        }
        .msg.ok { color: #059669; }
        .msg.err { color: #dc2626; }

        .entry {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }
        .entry:last-child { border-bottom: none; }
        .entry:hover { background: #f9fafb; }

        .entry-thumb {
            width: 56px;
            height: 56px;
            border-radius: 8px;
            object-fit: cover;
            background: #111827;
            flex-shrink: 0;
        }

        .entry-info { flex: 1; min-width: 0; }
        .entry-name { color: #1f2937; font-weight: 600; }
        .entry-meta {
            color: #9ca3af;
            font-size: 12px;
        }

        .empty { color: #9ca3af; text-align: center; padding: 20px; }

        .cast-header {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 14px;
        }

        .cast-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            gap: 16px;
        }

        .cast-card { text-align: center; }

        .cast-thumb {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            border-radius: 8px;
            background: #111827;
            margin-bottom: 6px;
        }

        .cast-name {
            color: #1f2937;
            font-weight: 600;
            font-size: 13px;
            margin-bottom: 8px;
        }

        button.cast-add {
            width: 100%;
            padding: 6px 0;
            font-size: 13px;
            background: #6b7280;
        }
        button.cast-add:hover { background: #4b5563; }
        button.cast-add.added { background: #059669; cursor: default; }
        button.cast-add.added:hover { background: #059669; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/FameFrame.html" class="home-btn" title="FameFrame" aria-label="FameFrame"><img src="/favicon.svg" alt="FameFrame"></a>

        <header>
            <h1>FameFrame Author</h1>
            <p class="subtitle">Add faces to the flashcard deck</p>
        </header>

        <div class="card">
            <h2>Search</h2>
            <div class="form-group">
                <div class="input-row">
                    <select id="searchType">
                        <option value="series">TV Show</option>
                        <option value="movie">Movie</option>
                        <option value="sports">Sports Team</option>
                    </select>
                    <input type="text" id="searchQuery" placeholder="e.g. Breaking Bad" onkeydown="if (event.key === 'Enter') { event.preventDefault(); runSearch(); }">
                    <button type="button" onclick="runSearch()">Search</button>
                </div>
            </div>
            <div id="searchResults"></div>
        </div>

        <div class="card">
            <h2>Add a new face</h2>
            <form id="addForm" onsubmit="return addEntry(event)">
                <div class="form-group">
                    <label for="name">Name</label>
                    <div class="input-row">
                        <input type="text" id="name" placeholder="e.g. Marie Curie" required>
                        <button type="button" class="search" onclick="searchName()">Search</button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="imageUrl">Image URL</label>
                    <input type="url" id="imageUrl" placeholder="https://…" required oninput="updatePreview()">
                    <div class="preview" id="preview"><img id="previewImg" src="" alt=""></div>
                </div>
                <div class="form-group">
                    <label for="tags">Tags</label>
                    <input type="text" id="tags" placeholder="comma, separated, tags">
                </div>
                <button type="submit" id="submitBtn">Add Face</button>
                <div class="msg" id="formMsg"></div>
            </form>
        </div>

    </div>

    <script>
        function escapeHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        async function runSearch() {
            const type = document.getElementById('searchType').value;
            const query = document.getElementById('searchQuery').value.trim();
            const resultsEl = document.getElementById('searchResults');
            if (!query) return;

            if (type === 'sports') {
                window.open('https://www.google.com/search?tbm=isch&tbs=sur:cl&q=' + encodeURIComponent(query + ' sports team logo'), '_blank');
                return;
            }

            resultsEl.innerHTML = '<div class="empty">Searching…</div>';
            try {
                const res = await fetch(`/tvdb/search?type=${type}&q=${encodeURIComponent(query)}`);
                const data = await res.json();
                if (!res.ok || !data.success) {
                    resultsEl.innerHTML = `<div class="empty">${escapeHtml(data.error || 'Search failed.')}</div>`;
                    return;
                }
                renderSearchResults(data.results || [], type);
            } catch (err) {
                resultsEl.innerHTML = '<div class="empty">Network error: ' + escapeHtml(err.message) + '</div>';
            }
        }

        function renderSearchResults(items, type) {
            const resultsEl = document.getElementById('searchResults');
            if (items.length === 0) {
                resultsEl.innerHTML = '<div class="empty">No results found.</div>';
                return;
            }
            resultsEl.innerHTML = '';
            items.slice(0, 10).forEach(item => {
                const image = item.image_url || item.thumbnail || '';
                const row = document.createElement('div');
                row.className = 'entry';
                row.innerHTML =
                    `<img class="entry-thumb" src="${escapeHtml(image)}" alt="" onerror="this.style.visibility='hidden'">` +
                    `<div class="entry-info">` +
                        `<div class="entry-name">${escapeHtml(item.name || '')}</div>` +
                        `<div class="entry-meta">${escapeHtml(item.year || '')}</div>` +
                    `</div>`;
                row.addEventListener('click', () => selectSearchResult(item, type));
                resultsEl.appendChild(row);
            });
        }

        function extractTvdbId(item) {
            if (item.tvdb_id) return item.tvdb_id;
            return String(item.id || item.objectID || '').replace(/^(series|movie)-/, '');
        }

        async function selectSearchResult(item, type) {
            const resultsEl = document.getElementById('searchResults');
            const tag = item.name || '';
            const id = extractTvdbId(item);
            resultsEl.innerHTML = '<div class="empty">Loading cast…</div>';

            try {
                let actors = [];
                if (type === 'series') {
                    const res = await fetch(`/tvdb/cast?series_id=${id}`);
                    const data = await res.json();
                    if (data.success) actors = data.cast || [];
                } else {
                    const res = await fetch(`/tvdb/details?id=${id}&type=movie`);
                    const data = await res.json();
                    if (data.success && data.data && data.data.characters) {
                        actors = data.data.characters
                            .filter(c => c.peopleType === 'Actor')
                            .sort((a, b) => (a.sort || 0) - (b.sort || 0));
                    }
                }
                renderCast(actors, tag);
            } catch (err) {
                resultsEl.innerHTML = '<div class="empty">Error loading cast: ' + escapeHtml(err.message) + '</div>';
            }
        }

        function renderCast(actors, tag) {
            const resultsEl = document.getElementById('searchResults');
            resultsEl.innerHTML = '';

            const header = document.createElement('div');
            header.className = 'cast-header';
            header.textContent = `Cast of "${tag}"`;
            resultsEl.appendChild(header);

            if (actors.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'empty';
                empty.textContent = 'No cast found.';
                resultsEl.appendChild(empty);
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'cast-grid';

            actors.slice(0, 10).forEach(actor => {
                const name = actor.personName || '';
                const image = actor.personImgURL || actor.image || '';

                const card = document.createElement('div');
                card.className = 'cast-card';

                const img = document.createElement('img');
                img.className = 'cast-thumb';
                img.src = image;
                img.alt = '';
                img.onerror = () => { img.style.visibility = 'hidden'; };

                const nameEl = document.createElement('div');
                nameEl.className = 'cast-name';
                nameEl.textContent = name;

                const addBtn = document.createElement('button');
                addBtn.type = 'button';
                addBtn.className = 'cast-add';
                addBtn.textContent = 'Add';
                addBtn.addEventListener('click', () => addCastMember(addBtn, name, image, tag));

                card.appendChild(img);
                card.appendChild(nameEl);
                card.appendChild(addBtn);
                grid.appendChild(card);
            });

            resultsEl.appendChild(grid);
        }

        async function addCastMember(btn, name, image, tag) {
            btn.disabled = true;
            btn.textContent = 'Adding…';
            try {
                const res = await fetch('/fameframe_api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, image_url: image, tags: tag })
                });
                const data = await res.json();
                if (data.success) {
                    btn.textContent = 'Added';
                    btn.classList.add('added');
                } else {
                    btn.textContent = 'Retry';
                    btn.disabled = false;
                    alert(data.error || 'Failed to add.');
                }
            } catch (err) {
                btn.textContent = 'Retry';
                btn.disabled = false;
                alert('Network error: ' + err.message);
            }
        }

        function searchName() {
            const name = document.getElementById('name').value.trim();
            if (!name) return;
            window.open('https://www.google.com/search?tbm=isch&tbs=sur:cl&q=' + encodeURIComponent(name), '_blank');
        }

        function updatePreview() {
            const url = document.getElementById('imageUrl').value.trim();
            const preview = document.getElementById('preview');
            const img = document.getElementById('previewImg');
            if (url) {
                img.src = url;
                preview.style.display = 'flex';
            } else {
                preview.style.display = 'none';
            }
        }

        function setMsg(text, kind) {
            const el = document.getElementById('formMsg');
            el.textContent = text;
            el.className = 'msg' + (kind ? ' ' + kind : '');
        }

        async function addEntry(e) {
            e.preventDefault();
            const name = document.getElementById('name').value.trim();
            const imageUrl = document.getElementById('imageUrl').value.trim();
            const tags = document.getElementById('tags').value.trim();
            if (!name || !imageUrl) return false;

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            setMsg('Saving…', '');

            try {
                const res = await fetch('/fameframe_api', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, image_url: imageUrl, tags })
                });
                const data = await res.json();
                if (data.success) {
                    setMsg(`Added "${name}".`, 'ok');
                    document.getElementById('addForm').reset();
                    document.getElementById('preview').style.display = 'none';
                } else {
                    setMsg(data.error || 'Failed to add.', 'err');
                }
            } catch (err) {
                setMsg('Network error: ' + err.message, 'err');
            } finally {
                btn.disabled = false;
            }
            return false;
        }

    </script>
</body>
</html>
